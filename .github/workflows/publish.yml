name: Publish Decision Summary

on:
  push:
    branches:
      - main
    paths:
      - 'data/decisions.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve decisions
        run: python scripts/resolve_decisions.py

      - name: Generate decision summary
        run: python scripts/generate_decision_summary.py

      - name: Batch analyze trades
        run: python scripts/batch_analyze_trades.py

      - name: Generate today page
        run: python scripts/generate_today_page.py

      - name: Commit updated summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/decisions.json site/decisions.md cache/trade_analysis.json site/index.html
          git diff --staged --quiet || git commit -m "chore: update decision summary [skip ci]"
          git pull --rebase
          git push
